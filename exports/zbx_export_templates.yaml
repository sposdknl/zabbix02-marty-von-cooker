          triggers:
            - uuid: 85881b9432894a8785de0532a89b0038
              expression: 'last(/PFSense Kuchar/pfsense.pf.status)<>1'
              name: 'PFSense: Packet filter is not running'
              opdata: 'Current running state: {ITEM.LASTVALUE1}'
              priority: HIGH
