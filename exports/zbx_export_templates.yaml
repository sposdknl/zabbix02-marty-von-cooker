        - uuid: ef18e94f11114680b34c4716b4fcac07
          name: 'Source tracking table limit'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12325.1.200.1.5.2.0
          key: pfsense.source.tracking.table.limit
          description: |
