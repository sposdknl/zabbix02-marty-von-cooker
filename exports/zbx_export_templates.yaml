            - uuid: 8c00f954a7834bfdb666d7c989a46bd0
              name: 'Interface [{#IFNAME}({#IFALIAS})]: Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[{#SNMPINDEX}]'
              units: bps
              description: |
                MIB: IF-MIB
                An estimate of the interface's current bandwidth in units of 1,000,000 bits per second. If this object reports a value of `n' then the speed of the interface is somewhere in the range of `n-500,000' to`n+499,999'.  For interfaces which do not vary in bandwidth or for those where no accurate estimation can be made, this object should contain the nominal bandwidth. For a sub-layer which has no concept of bandwidth, this object should be zero.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: dae765bd8c9446a9907860774f173b5c
              name: 'Interface [{#IFNAME}({#IFALIAS})]: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[{#SNMPINDEX}]'
              description: |
                MIB: IF-MIB
                The current operational state of the interface.
                - The testing(3) state indicates that no operational packet scan be passed
                - If ifAdminStatus is down(2) then ifOperStatus should be down(2)
                - If ifAdminStatus is changed to up(1) then ifOperStatus should change to up(1) if the interface is ready to transmit and receive network traffic
                - It should change todormant(5) if the interface is waiting for external actions (such as a serial line waiting for an incoming connection)
                - It should remain in the down(2) state if and only if there is a fault that prevents it from going to the up(1) state
                - It should remain in the notPresent(6) state if the interface has missing(typically, hardware) components.
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: cc129781ebc94039bedd18494cb36708
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/PFSense Kuchar/net.if.status[{#SNMPINDEX}])=2)'
                  name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: Link down'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: |
                    This trigger expression works as follows:
                    1. It can be triggered if the operations status is down.
                    2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine context macro to value - 0. That marks this interface as not important. No new trigger will be fired if this interface is down.
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 33d8c810e78f40809bb5993a3a02e06c
              name: 'Interface [{#IFNAME}({#IFALIAS})]: Interface type'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}'
              key: 'net.if.type[{#SNMPINDEX}]'
              description: |
                MIB: IF-MIB
                The type of interface.
                Additional values for ifType are assigned by the Internet Assigned Numbers Authority (IANA),
                through updating the syntax of the IANAifType textual convention.
              valuemap:
                name: 'IF-MIB::ifType'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: network
                - tag: description
                  value: '{#IFALIAS}'
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 0912f0dba99342d38b5046b2d8c57430
              expression: |
                change(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}])<0 and last(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}])>0
                and (
                last(/PFSense Kuchar/net.if.type[{#SNMPINDEX}])=6 or
                last(/PFSense Kuchar/net.if.type[{#SNMPINDEX}])=7 or
                last(/PFSense Kuchar/net.if.type[{#SNMPINDEX}])=11 or
                last(/PFSense Kuchar/net.if.type[{#SNMPINDEX}])=62 or
                last(/PFSense Kuchar/net.if.type[{#SNMPINDEX}])=69 or
                last(/PFSense Kuchar/net.if.type[{#SNMPINDEX}])=117
                )
                and
                (last(/PFSense Kuchar/net.if.status[{#SNMPINDEX}])<>2)
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: |
                (change(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}])>0 and last(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}],#2)>0) or
                (last(/PFSense Kuchar/net.if.status[{#SNMPINDEX}])=2)
              name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: Ethernet has changed to lower speed than it was before'
              opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
              priority: INFO
              description: 'This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of autonegotiation issues. Acknowledge to close the problem manually.'
              dependencies:
                - name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/PFSense Kuchar/net.if.status[{#SNMPINDEX}])=2)'
              tags:
                - tag: scope
                  value: capacity
            - uuid: bcf0774785924bcbbaf7be78e541ba9e
              expression: |
                (avg(/PFSense Kuchar/net.if.in[{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}])) and
                last(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/PFSense Kuchar/net.if.in[{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}])'
              name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: High inbound bandwidth usage'
              event_name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: High inbound bandwidth usage ( > {$IF.UTIL.MAX:"{#IFNAME}"}% )'
              opdata: 'In: {ITEM.LASTVALUE1}, speed: {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'The utilization of the network interface is close to its estimated maximum bandwidth.'
              dependencies:
                - name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: Link down'
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/PFSense Kuchar/net.if.status[{#SNMPINDEX}])=2)'
              tags:
                - tag: scope
                  value: performance
            - uuid: 991ea3a07c254ceb82c14af63ab28fa3
              expression: |
                (avg(/PFSense Kuchar/net.if.out[{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}])) and
                last(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}])>0
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/PFSense Kuchar/net.if.out[{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/PFSense Kuchar/net.if.speed[{#SNMPINDEX}])'
              name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: High outbound bandwidth usage'
