        - uuid: dd4c6856ba2a4974869fc32c51784a9d
          name: 'Source tracking table current'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.12325.1.200.1.4.1.0
          key: pfsense.source.tracking.table.count
          description: |
            MIB: BEGEMOT-PF-MIB
