              trigger_prototypes:
                - uuid: bc2960556eaf4976b6456dbfaaef9bf1
                  expression: 'min(/PFSense Kuchar/net.if.out.errors[{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/PFSense Kuchar/net.if.out.errors[{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8'
                  name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: High output error rate'
                  event_name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: High output error rate ( > {$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
                  opdata: 'errors out: {ITEM.LASTVALUE2}'
                  priority: WARNING
                  description: 'It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.'
                  dependencies:
                    - name: 'PFSense: Interface [{#IFNAME}({#IFALIAS})]: Link down'
                      expression: '{$IFCONTROL:"{#IFNAME}"}=1 and (last(/PFSense Kuchar/net.if.status[{#SNMPINDEX}])=2)'
